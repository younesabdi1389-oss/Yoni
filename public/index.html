<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MY TRACK</title>
  <meta name="theme-color" content="#0b1d4d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <!-- ورود -->
  <main id="login" class="login hidden">
    <form id="loginForm" class="panel login-box">
      <div class="brand big"><span class="logo" data-ic="logo"></span><b>MY TRACK</b></div>
      <p class="muted">Your Life. Your Progress. Your Track.</p>
      <label>نام کاربری<input name="username" autocomplete="username" required></label>
      <label>رمز عبور<input name="password" type="password" autocomplete="current-password" required></label>
      <div class="err" id="loginErr"></div>
      <button class="btn primary wide" type="submit">ورود</button>
    </form>
  </main>

  <!-- برنامه -->
  <div id="app" class="app hidden">
    <aside class="nav" id="appnav">
      <div class="brandrow"><div class="brand"><span class="logo" data-ic="logo"></span><b>MY TRACK</b></div><button id="collapse" class="icon-btn" aria-label="جمع‌کردن یا باز‌کردن منو"><span data-ic="chevron"></span></button></div>
      <nav id="nav"></nav>
    </aside>
    <main class="content"><div id="view"></div></main>
    <nav id="tabbar" class="tabbar" aria-label="منوی اصلی"></nav>
  </div>
  <div id="menu" class="menu hidden"></div>

  <div id="modal" class="modal hidden"></div>
  <div id="toast" class="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="/js/core.js"></script>
  <script src="/js/views-learning.js"></script>
  <script src="/js/views-life.js"></script>
  <script src="/js/views-money.js"></script>
  <script src="/js/views-dash.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
